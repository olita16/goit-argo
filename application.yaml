apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-app
  namespace: infra-tools
spec:
  project: default

  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: 1.8.5

    helm:
      values: |
        service:
          type: ClusterIP
          port: 5000

        auth:
          enabled: false

        backendStore:
          defaultSqlitePath: /tmp/mlflow.db
          databaseConnectionCheck: false

        postgresql:
          enabled: false

        mysql:
          enabled: false

        resources:
          requests:
            cpu: 100m
            memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true