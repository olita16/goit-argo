replicaCount: 1

service:
  enabled: true
  type: ClusterIP
  port: 5000

auth:
  enabled: false

postgresql:
  enabled: false

mysql:
  enabled: false

backendStore:
  defaultSqlitePath: /tmp/mlflow.db
  databaseConnectionCheck: false
  databaseMigration: false

artifactRoot:
  defaultArtifactsDestination: /tmp/mlartifacts

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 1Gi

livenessProbe:
  initialDelaySeconds: 120
  timeoutSeconds: 10
  periodSeconds: 30
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 60
  timeoutSeconds: 10
  periodSeconds: 20
  failureThreshold: 5

image:
  repository: burakince/mlflow
  tag: 3.13.0

extraArgs:
  workers: "1" 

extraEnvVars:
  MLFLOW_DISABLE_ENV_MANAGER: "true"