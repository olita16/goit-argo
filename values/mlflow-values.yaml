replicaCount: 1

service:
  enabled: true
  type: ClusterIP
  port: 5000

auth:
  enabled: false

postgresql:
  enabled: false

mysql:
  enabled: false

backendStore:
  defaultSqlitePath: /tmp/mlflow.db
  databaseConnectionCheck: false
  databaseMigration: true

artifactRoot:
  defaultArtifactsDestination: /tmp/mlartifacts

resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    memory: 768Mi

livenessProbe:
  initialDelaySeconds: 60
  timeoutSeconds: 10
  periodSeconds: 30
  failureThreshold: 10

readinessProbe:
  initialDelaySeconds: 60
  timeoutSeconds: 10
  periodSeconds: 30
  failureThreshold: 10

image:
  repository: mlflow/mlflow
  tag: 2.10.2
  pullPolicy: IfNotPresent

extraArgs:
  workers: 1