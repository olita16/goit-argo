helm:
  values: |
    replicaCount: 1

  service:
    type: ClusterIP
    port: 80

  auth:
    enabled: false

  postgresql:
    enabled: false

  mysql:
    enabled: false

  backendStore:
    databaseConnectionCheck: false
    databaseMigration: false
    defaultSqlitePath: /tmp/mlflow.db

  artifactRoot:
    defaultArtifactsDestination: /tmp/mlartifacts

  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 768Mi
