replicaCount: 1

service:
  enabled: true
  type: ClusterIP
  port: 5000

auth:
  enabled: false

postgresql:
  enabled: false

mysql:
  enabled: false

backendStore:
  defaultSqlitePath: /tmp/mlflow.db
  databaseConnectionCheck: false
  databaseMigration: true

artifactRoot:
  defaultArtifactsDestination: /tmp/mlartifacts

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

livenessProbe:
  initialDelaySeconds: 60
  timeoutSeconds: 10
  periodSeconds: 30
  failureThreshold: 10

readinessProbe:
  initialDelaySeconds: 60
  timeoutSeconds: 10
  periodSeconds: 30
  failureThreshold: 10
