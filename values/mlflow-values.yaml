service:
  type: ClusterIP
  port: 5000

auth:
  enabled: false

postgresql:
  enabled: false

mysql:
  enabled: false

backendStore:
  defaultSqlitePath: /mlflow/data/mlflow.db

artifactRoot:
  defaultArtifactRoot: file:///mlflow/data/artifacts

resources:
  requests:
    cpu: 100m
    memory: 512Mi

strategy:
  type: Recreate

extraVolumes:
  - name: mlflow-data
    emptyDir: {}

extraVolumeMounts:
  - name: mlflow-data
    mountPath: /mlflow/data