apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-app
  namespace: infra-tools
spec:
  project: default

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: mlflow
    targetRevision: 1.4.0

    helm:
      values: |
        service:
          type: ClusterIP

        minio:
          persistence:
            enabled: false

        postgresql:
          primary:
            persistence:
              enabled: false

        tracking:
          persistence:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true